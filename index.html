<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101214"><title>AxoVids</title>
<link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png">
<style>
:root{--bg:#101214;--panel:#1b1e22;--line:#2b3036;--ink:#f2f4f5;--dim:#9aa3ab;--aqua:#2fd6b4;--red:#ff0033;--gill:#ff8fb3;color-scheme:dark}
*{box-sizing:border-box;margin:0}html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.4 ui-monospace,Consolas,Menlo,monospace;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0)}
header{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--panel);border-bottom:2px solid var(--aqua)}
header .brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:18px;margin-right:auto;cursor:pointer}
header .brand svg{width:30px;height:30px}
button{font:inherit;color:var(--ink);background:#2c3138;border:0;padding:9px 14px;cursor:pointer;border-radius:4px}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--aqua);outline-offset:2px}
.go{background:var(--aqua);color:#06110e;font-weight:700}.hot{background:var(--red)}
main{flex:1;min-height:0;position:relative}
.view{display:none;height:100%;overflow:auto;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0))}
.view.on{display:block}#feedv.on{display:flex;padding:0}
h2{text-align:center;margin-bottom:14px}.sub{color:var(--dim);text-align:center;margin-bottom:14px}
label{display:block;color:var(--dim);margin:12px 0 4px}
input,textarea,select{width:100%;background:var(--panel);color:var(--ink);border:1px solid var(--dim);padding:9px;font:inherit;border-radius:3px}
.row{display:flex;gap:8px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.item{background:var(--panel);padding:12px 14px;margin-top:8px;display:flex;justify-content:space-between;align-items:center;gap:8px;cursor:pointer}
#feed{flex:1;overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none}
.short{height:100%;scroll-snap-align:start;position:relative;display:flex;align-items:center;justify-content:center;background:#000;overflow:hidden}
.short .media{height:100%;max-width:100%;aspect-ratio:9/16;object-fit:cover;background:#16191d}
.short svg.media{width:auto}
.cap{position:absolute;left:0;right:76px;bottom:0;padding:44px 14px 14px;background:linear-gradient(transparent,rgba(0,0,0,.8))}
.cap b{display:block;font-size:16px}.cap span{color:#d3d9de}
.cap a{color:var(--aqua);margin-right:8px;cursor:pointer}
.rail{position:absolute;right:8px;bottom:84px;display:flex;flex-direction:column;gap:8px}
.rail button{width:60px;padding:10px 0;font-size:12px;background:rgba(27,30,34,.88)}
.rail .on{background:var(--gill);color:#2a0612;font-weight:700}
dialog{background:var(--panel);color:var(--ink);border:1px solid var(--line);padding:16px;width:min(92vw,420px);max-height:70vh;margin:auto}
dialog::backdrop{background:rgba(0,0,0,.6)}
dialog .c{padding:8px 0;border-bottom:1px solid var(--line)}
.av{width:28px;height:28px;border-radius:50%;object-fit:cover;background:var(--line);display:inline-flex;align-items:center;justify-content:center;font-size:12px;overflow:hidden;vertical-align:middle;margin:0 6px 0 0}.avs{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}.pfp{border-radius:50%;width:96px;height:96px;margin:10px auto;background:var(--panel);display:flex;align-items:center;justify-content:center;color:var(--dim);overflow:hidden;font-size:12px}.pfp img{width:100%;height:100%;object-fit:cover}
@media (prefers-reduced-motion:no-preference){.logo-wiggle{animation:w 1.4s ease-in-out 1}@keyframes w{50%{transform:rotate(-8deg)}}}
</style></head><body>
<header><div class="brand" onclick="show('feedv')"><svg class="logo-wiggle" viewBox="0 0 512 512" aria-hidden="true"><rect width="512" height="512" rx="112" fill="#2b3036"/><g stroke="#ff8fb3" stroke-width="26" stroke-linecap="round" fill="none"><path d="M150 210C100 190 80 150 92 112M142 258C84 258 56 232 50 192M362 210C412 190 432 150 420 112M370 258C428 258 456 232 462 192"/></g><ellipse cx="256" cy="290" rx="130" ry="112" fill="#2fd6b4"/><circle cx="212" cy="270" r="14" fill="#101214"/><circle cx="300" cy="270" r="14" fill="#101214"/><path d="M214 322Q256 356 298 322" stroke="#101214" stroke-width="12" stroke-linecap="round" fill="none"/></svg>AxoVids</div>
<button id="acctBtn" onclick="show('acctv')">Account</button><button class="hot" onclick="show('upv')">Upload</button><button onclick="show('seav')">Search</button></header>
<main>
<section id="feedv" class="view on"><button id="snb" class="go" onclick="toggleSound()" style="position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:5;display:none">Tap for sound</button><div id="feed"></div></section>

<section id="seav" class="view"><h2>Search</h2>
<div style="display:flex;gap:8px"><input id="q" placeholder="Search videos and creators" oninput="doSearch()"><select id="qt" style="width:110px" onchange="doSearch()"><option>All</option><option>Videos</option><option>Creators</option></select></div><div id="res"></div></section>

<section id="profv" class="view"><div class="pfp" id="ppic"></div><h2 id="pn"></h2><p class="sub" id="ps"></p><div class="row"><button class="go" id="pf" onclick="toggleFollow(curProf)">Follow</button><button class="hot" id="pban" onclick="ban(curProf)" style="display:none">Ban account</button></div><p class="sub" style="margin-top:22px">Followers</p><div class="avs" id="pfl"></div><p class="sub" style="margin-top:22px">Posted videos</p><div id="pv"></div></section>

<section id="upv" class="view"><h2>Upload a short</h2><p class="sub">Add a title and description, then publish a video or picture to the feed.</p>
<label for="ut">Title</label><input id="ut"><label for="ud">Description</label><textarea id="ud" rows="4"></textarea>
<p class="sub" id="uf" style="margin-top:14px">No file selected</p><input type="file" id="ufile" accept="video/*,image/*" hidden>
<div class="row"><button onclick="ufile.click()">Choose video or picture</button></div>
<div class="row"><button class="hot" onclick="publish()">Publish video</button></div><div class="row"><button onclick="show('feedv')">Back to feed</button></div></section>

<section id="acctv" class="view"><h2 id="an">Sign in</h2><p class="sub" id="as">Create an account on this device to post and follow.</p>
<div class="pfp" id="pfp">No profile picture</div>
<label for="un">Username</label><input id="un" autocomplete="username"><label for="em">Email</label><input id="em" type="email"><label for="pw">Password</label><input id="pw" type="password">
<div class="row"><button class="go" onclick="login()">Log in</button><button onclick="login(true)">Create account</button></div>
<input type="file" id="pimg" accept="image/*" hidden><div class="row"><button onclick="pimg.click()">Choose profile picture</button></div>
<div class="row"><button onclick="logout()">Log out</button><button class="hot" onclick="delAcct()">Delete my account</button></div><div id="mine"></div><div id="own"></div><p class="sub" style="margin-top:22px;font-size:12px">AxoVids version 3</p></section>
</main>
<dialog id="cm"><b>Comments</b><div id="cl"></div><input id="ci" placeholder="Add a comment" style="margin-top:10px"><div class="row"><button class="go" onclick="addComment()">Post comment</button><button onclick="cm.close()">Close</button></div></dialog>
<div id="toast" role="status" style="display:none;position:fixed;left:12px;right:12px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:20;background:var(--panel);border:1px solid var(--gill);padding:12px;border-radius:6px;text-align:center"></div>
<script>
const $=id=>document.getElementById(id),OWNER='Axolotking';
const dbp=new Promise((res,rej)=>{const r=indexedDB.open('axovids',1);r.onupgradeneeded=()=>{const d=r.result;['users','videos','blobs'].forEach(s=>d.createObjectStore(s,{keyPath:s==='users'?'name':'id'}))};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
async function tx(st,mode,fn){const d=await dbp;return new Promise((res,rej)=>{const t=d.transaction(st,mode),r=fn(t.objectStore(st));t.oncomplete=()=>res(r&&r.result);t.onerror=t.onabort=()=>rej(t.error)})}
const getAll=s=>tx(s,'readonly',o=>o.getAll()),put=(s,v)=>tx(s,'readwrite',o=>o.put(v)),del=(s,k)=>tx(s,'readwrite',o=>o.delete(k));
let users=[],vids=[],urls={},me=null,curProf='',curVid=null,soundOn=false,upFile=null;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const byName=n=>users.find(u=>u.name===n),isOwner=()=>me&&me.role==='owner',liked=v=>me&&v.likes.includes(me.name);
const visible=()=>vids.filter(v=>{const u=byName(v.by);return u&&!u.banned});
const av=n=>{const u=byName(n);return u&&u.pic?`<img class="av" src="${u.pic}" alt="">`:`<span class="av">${esc((n||'?')[0]).toUpperCase()}</span>`};
const need=()=>{if(!me){alert('Log in first.');show('acctv');return false}return true};
async function hash(pw,salt){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);const b=await crypto.subtle.deriveBits({name:'PBKDF2',salt,iterations:100000,hash:'SHA-256'},k,256);return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
async function load(){users=await getAll('users');vids=(await getAll('videos')).sort((a,b)=>b.created-a.created);for(const b of await getAll('blobs'))urls[b.id]=URL.createObjectURL(b.blob);const s=localStorage.getItem('axo_session'),u=s&&byName(s);me=u&&!u.banned?u:null}
function show(v){document.querySelectorAll('.view').forEach(e=>e.classList.toggle('on',e.id===v));if(v==='acctv')renderAcct();if(v==='seav')doSearch();paintSound()}
const on=id=>$(id).classList.contains('on');
function render(){renderFeed();renderAcct();if(on('profv'))prof(curProf);if(on('seav'))doSearch();paintSound()}
function followBtn(n){if(me&&me.name===n)return'';const f=me&&me.following.includes(n);return `<button class="fb ${f?'':'go'}" data-f="${n}" style="padding:4px 10px" onclick="toggleFollow('${n}')">${f?'Following':'Follow'}</button>`}
function card(v){const own=me&&(isOwner()||me.name===v.by),vid=v.type==='video';return `<div class="short" data-id="${v.id}">${vid?`<video class="media" src="${urls[v.id]}" loop playsinline></video>`:`<img class="media" src="${urls[v.id]}" alt="${esc(v.title)}">`}
<div class="rail"><button class="lk ${liked(v)?'on':''}" onclick="like('${v.id}')">${liked(v)?'Liked':'Like'}<br>${v.likes.length}</button>${vid?`<button onclick="togglePlay('${v.id}')">Pause</button><button class="snd" onclick="toggleSound()">${soundOn?'Sound on':'Sound off'}</button>`:''}<button onclick="openC('${v.id}')">Comments<br><span class="cc">${v.comments.length}</span></button>${own?`<button class="hot" onclick="removeVid('${v.id}')">Delete</button>`:''}</div>
<div class="cap"><b>${esc(v.title)}</b>${av(v.by)}<a onclick="prof('${v.by}')">@${esc(v.by)}</a>${followBtn(v.by)}<br><span>${esc(v.desc)}</span></div></div>`}
function renderFeed(){const l=visible();$('feed').innerHTML=l.length?l.map(card).join(''):'<div class="short" style="color:var(--dim);text-align:center;padding:24px">No videos yet.<br>Press Upload to post the first one.</div>';observe()}
function playV(m){m.muted=!soundOn;m.volume=1;m.play().then(()=>{if(soundOn)setTimeout(()=>checkAudio(m),1500)}).catch(e=>{if(e&&e.name==='NotAllowedError'){if(soundOn){soundOn=false;paintSound()}m.muted=true;m.play().catch(()=>{})}})}
function checkAudio(m){if(!soundOn||m.paused||m.muted||m.currentTime<.5)return;if(m.mozHasAudio===false||(typeof m.webkitAudioDecodedByteCount==='number'&&m.webkitAudioDecodedByteCount===0))toast('No sound detected in this video. It may have no audio track, or this phone can’t play its audio format.')}
function toast(t){const e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',7000)}
function playVisible(){document.querySelectorAll('.short video').forEach(m=>{const t=m.getBoundingClientRect().top;if(t>=-5&&t<innerHeight/2)playV(m)})}
function paintSound(){document.querySelectorAll('video').forEach(m=>m.muted=!soundOn);document.querySelectorAll('.snd').forEach(b=>b.textContent=soundOn?'Sound on':'Sound off');const sb=$('snb');if(sb)sb.style.display=soundOn||!on('feedv')||!document.querySelector('.short video')?'none':''}
function toggleSound(){soundOn=!soundOn;paintSound();if(soundOn)playVisible()}
addEventListener('click',()=>{if(!soundOn){soundOn=true;paintSound();playVisible()}},{once:true});
let io;function observe(){io&&io.disconnect();io=new IntersectionObserver(es=>es.forEach(e=>{const m=e.target.querySelector('video');if(m)e.isIntersecting?playV(m):m.pause()}),{threshold:.7});document.querySelectorAll('.short').forEach(s=>io.observe(s))}
function togglePlay(id){const m=document.querySelector(`.short[data-id="${id}"] video`);if(m)m.paused?m.play():m.pause()}
async function like(id){if(!need())return;const v=vids.find(x=>x.id===id),i=v.likes.indexOf(me.name);i<0?v.likes.push(me.name):v.likes.splice(i,1);await put('videos',v);const b=document.querySelector(`.short[data-id="${id}"] .lk`);if(b){b.className='lk '+(liked(v)?'on':'');b.innerHTML=(liked(v)?'Liked':'Like')+'<br>'+v.likes.length}}
async function toggleFollow(n){if(!need())return;const i=me.following.indexOf(n);i<0?me.following.push(n):me.following.splice(i,1);await put('users',me);document.querySelectorAll('.fb').forEach(b=>{if(b.dataset.f===n){const f=me.following.includes(n);b.textContent=f?'Following':'Follow';b.classList.toggle('go',!f)}});if(on('profv'))prof(n)}
function openC(id){curVid=vids.find(x=>x.id===id);drawC();cm.showModal()}
function drawC(){$('cl').innerHTML=curVid.comments.length?curVid.comments.map(c=>`<div class="c">${av(c.by)}<b>${esc(c.by)}</b> ${esc(c.text)}</div>`).join(''):'<div class="c" style="color:var(--dim)">No comments yet. Be the first.</div>'}
async function addComment(){if(!need())return;const t=$('ci').value.trim();if(!t)return;curVid.comments.push({by:me.name,text:t,t:Date.now()});await put('videos',curVid);$('ci').value='';drawC();const c=document.querySelector(`.short[data-id="${curVid.id}"] .cc`);if(c)c.textContent=curVid.comments.length}
async function removeVid(id){const v=vids.find(x=>x.id===id);if(!v||!me||!(isOwner()||me.name===v.by)||!confirm('Delete this video?'))return;await del('videos',id);await del('blobs',id);URL.revokeObjectURL(urls[id]);delete urls[id];vids=vids.filter(x=>x.id!==id);render()}
async function ban(n){if(!isOwner())return;const u=byName(n);if(!u||u.role==='owner')return;u.banned=!u.banned;await put('users',u);render()}
function prof(n){const u=byName(n);if(!u)return;curProf=n;const mine=visible().filter(v=>v.by===n),fl=users.filter(x=>!x.banned&&x.following.includes(n));
$('ppic').innerHTML=u.pic?`<img src="${u.pic}" alt="Profile picture of ${esc(n)}">`:'No profile picture';
$('pn').textContent='@'+n+(u.role==='owner'?' [owner]':'')+(u.banned?' (banned)':'');
$('ps').textContent='Followers: '+fl.length+'   Likes: '+mine.reduce((a,v)=>a+v.likes.length,0);
$('pf').style.display=me&&me.name!==n?'':'none';$('pf').textContent=me&&me.following.includes(n)?'Following':'Follow';
$('pban').style.display=isOwner()&&u.role!=='owner'?'':'none';$('pban').textContent=u.banned?'Unban account':'Ban account';
$('pfl').innerHTML=fl.map(x=>`<span class="item" style="margin:0" onclick="prof('${x.name}')">${av(x.name)}${esc(x.name)}</span>`).join('')||'<span class="sub">No followers yet.</span>';
$('pv').innerHTML=mine.map(v=>`<div class="item" onclick="goVid('${v.id}')"><b>${esc(v.title)}</b><span style="color:var(--dim)">${v.likes.length} likes</span></div>`).join('')||'<p class="sub">No videos yet.</p>';show('profv')}
function goVid(id){show('feedv');const e=document.querySelector(`.short[data-id="${id}"]`);e&&e.scrollIntoView()}
function doSearch(){const q=$('q').value.toLowerCase(),t=$('qt').value;let h='';if(t!=='Videos')users.filter(u=>!u.banned&&u.name.toLowerCase().includes(q)).forEach(u=>h+=`<div class="item" onclick="prof('${u.name}')"><span>${av(u.name)}<b>${esc(u.name)}</b></span></div>`);if(t!=='Creators')visible().filter(v=>(v.title+' '+v.desc).toLowerCase().includes(q)).forEach(v=>h+=`<div class="item" onclick="goVid('${v.id}')"><b>${esc(v.title)}</b><span style="color:var(--dim)">@${esc(v.by)}</span></div>`);$('res').innerHTML=h||'<p class="sub" style="margin-top:20px">No results.</p>'}
$('ufile').onchange=e=>{upFile=e.target.files[0]||null;$('uf').textContent=upFile?upFile.name:'No file selected'};
async function publish(){if(!need())return;const t=$('ut').value.trim();if(!t||!upFile)return alert('Add a title and choose a file first.');const v={id:Date.now()+'-'+Math.random().toString(36).slice(2,7),title:t,desc:$('ud').value,by:me.name,type:upFile.type.startsWith('video')?'video':'image',likes:[],comments:[],created:Date.now()};
try{await put('blobs',{id:v.id,blob:upFile});await put('videos',v)}catch(e){await del('blobs',v.id).catch(()=>{});return alert('Could not save. The device may be out of storage.')}
urls[v.id]=URL.createObjectURL(upFile);vids.unshift(v);$('ut').value=$('ud').value='';upFile=null;$('ufile').value='';$('uf').textContent='No file selected';render();show('feedv')}
async function login(create){const n=$('un').value.trim(),em=$('em').value.trim(),pw=$('pw').value;if(!n||!pw)return alert('Enter a username and password.');const ex=users.find(u=>u.name.toLowerCase()===n.toLowerCase());
if(create){if(!/^[A-Za-z0-9_.-]{3,20}$/.test(n))return alert('Username: 3 to 20 letters, numbers, dots, dashes or underscores.');if(ex)return alert('That username is taken.');if(!/^\S+@\S+\.\S+$/.test(em))return alert('Enter a valid email.');if(pw.length<8)return alert('Use a password of at least 8 characters.');
const salt=[...crypto.getRandomValues(new Uint8Array(16))],o=n.toLowerCase()===OWNER.toLowerCase();const u={name:o?OWNER:n,email:em,salt,h:await hash(pw,new Uint8Array(salt)),pic:null,role:o?'owner':'user',banned:false,following:[]};await put('users',u);users.push(u);me=u}
else{if(!ex||ex.h!==await hash(pw,new Uint8Array(ex.salt)))return alert('Wrong username or password.');if(ex.banned)return alert('This account has been banned.');me=ex}
localStorage.setItem('axo_session',me.name);$('pw').value='';render()}
function logout(){me=null;localStorage.removeItem('axo_session');render()}
$('pimg').onchange=async e=>{const f=e.target.files[0];if(!f)return;if(!me)return alert('Log in first.');const im=await createImageBitmap(f),s=Math.min(1,256/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);me.pic=c.toDataURL('image/jpeg',.85);await put('users',me);render()};
async function delAcct(){if(!me||!confirm('Delete your account and its videos?'))return;for(const v of vids.filter(x=>x.by===me.name)){await del('videos',v.id);await del('blobs',v.id);URL.revokeObjectURL(urls[v.id])}vids=vids.filter(x=>x.by!==me.name);await del('users',me.name);users=users.filter(u=>u.name!==me.name);logout()}
function renderAcct(){$('acctBtn').textContent=me?'Account: '+me.name:'Account';$('an').textContent=me?me.name+'’s account':'Sign in';$('as').textContent=me?'Signed in as '+me.name+(isOwner()?' (owner).':'.'):'Create an account on this device to post, like and comment.';
$('pfp').innerHTML=me&&me.pic?`<img src="${me.pic}" alt="Profile picture">`:'No profile picture';
$('mine').innerHTML=me?vids.filter(v=>v.by===me.name).map(v=>`<div class="item"><b>${esc(v.title)}</b><button class="hot" onclick="removeVid('${v.id}')">Delete</button></div>`).join(''):'';
$('own').innerHTML=isOwner()?'<p class="sub" style="margin-top:22px">Owner tools: accounts</p>'+(users.filter(u=>u.name!==me.name).map(u=>`<div class="item"><span>${av(u.name)}${esc(u.name)}${u.banned?' (banned)':''}</span><button class="${u.banned?'go':'hot'}" onclick="ban('${u.name}')">${u.banned?'Unban':'Ban'}</button></div>`).join('')||'<p class="sub">No other accounts yet.</p>'):''}
(async()=>{try{await load();navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){alert('Storage is unavailable here, so nothing can be saved.')}render();if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{})})();
</script></body></html>
